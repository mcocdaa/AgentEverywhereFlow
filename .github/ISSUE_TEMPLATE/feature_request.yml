name: 💡 Feature Request / 功能建议
description: 为 AgentEverywhereFlow 提出新功能、新捕获后端或改进思路
title: "[Feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的新想法！我们致力于打造最灵活强大的桌面具身智能基础设施。
  - type: textarea
    id: problem
    attributes:
      label: 痛点与背景 (Problem or Motivation)
      description: 当前遇到了什么问题，或者现有功能有什么不便之处？
      placeholder: 例如：希望能够支持对特定多显示器虚拟桌面的即时捕获...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议的解决方案 (Proposed Solution)
      description: 你希望 AEFlow 如何实现或支持该功能？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 (Alternatives Considered)
      description: 你是否考虑过其他现有的解决手段或第三方工具？
  - type: textarea
    id: additional-context
    attributes:
      label: 补充说明 (Additional Context)
      description: 任何相关的参考链接、API 文档、草图或截图。
