name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Code Quality (ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Create virtualenv
        run: uv venv

      - name: Install dependencies
        run: uv pip install -e ".[dev,linux]"

      - name: Run ruff linter
        run: uv run ruff check .

      - name: Check code formatting
        run: uv run ruff format --check .

      - name: Run mypy type check
        run: uv run mypy agenteverywhereflow

      - name: Verify package build & bundled WebUI dist
        run: |
          uv build
          python3 -c "import glob, zipfile; whls = glob.glob('dist/*.whl'); assert whls, 'No wheel built'; z = zipfile.ZipFile(whls[0]); assert any('webui_dist/index.html' in n for n in z.namelist()), 'webui_dist/index.html missing from wheel'"

  test-linux:
    name: Test Linux (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create virtualenv
        run: uv venv

      - name: Install system dependencies for headless X11 testing
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk

      - name: Install package with test dependencies
        run: uv pip install -e ".[dev,linux]"

      - name: Run unit tests with pytest
        run: |
          xvfb-run -a uv run pytest tests/ -v

  test-windows:
    name: Test Windows (Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Create virtualenv
        run: uv venv

      - name: Install package with windows dependencies
        run: uv pip install -e ".[dev,windows]"

      - name: Run unit tests with pytest
        run: uv run pytest tests/ -v
