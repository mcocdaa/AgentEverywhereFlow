name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    name: Build package & create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build sdist and wheel & verify bundled WebUI
        run: |
          uv build
          python3 -c "import glob, zipfile; whls = glob.glob('dist/*.whl'); assert whls, 'No wheel built'; z = zipfile.ZipFile(whls[0]); assert any('webui_dist/index.html' in n for n in z.namelist()), 'webui_dist/index.html missing from wheel'"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
