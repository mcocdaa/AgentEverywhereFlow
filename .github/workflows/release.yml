name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test & verify wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Create virtualenv & install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk wmctrl xclip
          uv sync --extra dev --python 3.12

      - name: Verify version matches git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          uv run python3 -c "import os, tomllib, agenteverywhereflow; from packaging.version import Version; expected = Version(os.environ['GITHUB_REF_NAME'].removeprefix('v')); pv = Version(tomllib.load(open('pyproject.toml', 'rb'))['project']['version']); iv = Version(agenteverywhereflow.__version__); assert pv == expected and iv == expected, f'pyproject={pv}, __version__={iv}, expected={expected}'"

      - name: Run quality & unit checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy agenteverywhereflow
          xvfb-run -a uv run pytest tests/ -v

      - name: Build sdist and wheel & verify bundled WebUI + entrypoints
        run: |
          uv build
          python3 -c "import glob, zipfile; whls = glob.glob('dist/*.whl'); assert whls, 'No wheel built'; z = zipfile.ZipFile(whls[0]); names = z.namelist(); assert any('webui_dist/index.html' in n for n in names), 'webui_dist/index.html missing from wheel'; eps = [n for n in names if n.endswith('entry_points.txt')]; assert eps, 'entry_points.txt missing from wheel'; ep = z.read(eps[0]).decode('utf-8'); assert 'aef =' in ep and 'agenteverywhereflow =' in ep, f'Missing CLI entrypoints: {ep}'"

      - name: Upload built distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

  publish-pypi:
    name: Publish to PyPI (Trusted Publishing)
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
