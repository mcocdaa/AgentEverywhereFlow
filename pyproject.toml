[project]
name = "agenteverywhereflow"
version = "0.1.1"
description = "Agent on Everywhere: Summon an autonomous GUI agent on any screen or window."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "mcocdaa" }
]
keywords = [
    "ai",
    "agent",
    "computer-use",
    "gui-automation",
    "screen-capture",
    "vision-agent",
    "workflow",
    "windows",
    "linux",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pillow>=10.2.0",
    "mss>=9.0.1",
    "pyautogui>=0.9.54",
    "typer>=0.12.3",
    "rich>=13.7.1",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "anthropic>=1.8.0",
    "psutil>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/mcocdaa/AgentEverywhereFlow"
Repository = "https://github.com/mcocdaa/AgentEverywhereFlow.git"
Issues = "https://github.com/mcocdaa/AgentEverywhereFlow/issues"
Documentation = "https://github.com/mcocdaa/AgentEverywhereFlow#readme"
Changelog = "https://github.com/mcocdaa/AgentEverywhereFlow/blob/main/CHANGELOG.md"

[project.optional-dependencies]
windows = [
    "pywin32>=306; sys_platform == 'win32'",
    "pydirectinput>=1.0.4; sys_platform == 'win32'",
]
linux = [
    "python-xlib>=0.33; sys_platform == 'linux'",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
aef = "agenteverywhereflow.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agenteverywhereflow"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
